[project]
name = "pii-service"
version = "0.1.0"
description = "Offline PII redaction service POC using openai/privacy-filter"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.8.0",
    "torch>=2.3.0",
    "transformers>=4.46.0",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pii_service"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
